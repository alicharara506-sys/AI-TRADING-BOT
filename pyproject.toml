[project]
name = "ai-trading-bot"
version = "0.1.0"
description = "Institutional-grade quantitative trading platform for MetaTrader 4/5"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "pyarrow>=15.0",
    "pyzmq>=25.0",
    "numpy>=1.26",
    "statsmodels>=0.14",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "mypy>=1.9",
    "ruff>=0.4",
    "types-PyYAML>=6.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = [
    "core",
    "connectors",
    "execution_backends",
    "strategies",
    "quant",
    "backtesting",
    "optimization",
    "machine_learning",
    "analytics",
    "reporting",
    "notifications",
    "benchmarks",
]

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["statsmodels", "statsmodels.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["sklearn", "sklearn.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = [
    "core*",
    "connectors*",
    "execution_backends*",
    "strategies*",
    "quant*",
    "backtesting*",
    "optimization*",
    "machine_learning*",
    "analytics*",
    "reporting*",
    "notifications*",
    "benchmarks*",
]
