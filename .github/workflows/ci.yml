name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy core connectors execution_backends strategies quant backtesting optimization machine_learning analytics reporting notifications benchmarks
      - name: Import direction check
        run: python scripts/check_import_direction.py
      - name: Pytest
        run: pytest
